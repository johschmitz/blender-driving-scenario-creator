<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120" viewBox="0 0 200 120">
  <!-- Motorcycle: chopper side view -->
  <!-- Rear wheel (fat) -->
  <circle cx="42" cy="82" r="20" fill="none" stroke="#444" stroke-width="5"/>
  <circle cx="42" cy="82" r="3" fill="#444"/>
  <!-- Front wheel -->
  <circle cx="170" cy="82" r="18" fill="none" stroke="#444" stroke-width="3.5"/>
  <circle cx="170" cy="82" r="3" fill="#444"/>
  <!-- Swingarm -->
  <line x1="75" y1="72" x2="42" y2="82" stroke="#555" stroke-width="3"/>
  <!-- Frame backbone -->
  <line x1="75" y1="72" x2="90" y2="42" stroke="#333" stroke-width="3"/>
  <line x1="90" y1="42" x2="130" y2="32" stroke="#333" stroke-width="3"/>
  <!-- Fuel tank (big teardrop, flat bottom) -->
  <path d="M82,48 Q102,14 130,28 L130,48 L82,48 Z" fill="#e06000" stroke="#a04000" stroke-width="1.5"/>
  <!-- V-twin engine: rear cylinder -->
  <polygon points="78,58 86,42 92,44 84,62" fill="#555" stroke="#333" stroke-width="1.5"/>
  <!-- V-twin engine: front cylinder -->
  <polygon points="84,62 100,52 106,56 90,66" fill="#555" stroke="#333" stroke-width="1.5"/>
  <!-- Engine crankcase -->
  <polygon points="76,62 106,56 108,78 78,80" fill="#666" stroke="#444" stroke-width="1.5"/>
  <!-- Seat (low slung) -->
  <rect x="62" y="48" width="28" height="5" rx="2" fill="#333"/>
  <!-- Sissy bar -->
  <line x1="56" y1="52" x2="52" y2="32" stroke="#888" stroke-width="2"/>
  <!-- Tail / rear fender -->
  <path d="M30,68 Q42,55 54,68" fill="none" stroke="#e06000" stroke-width="2.5"/>
  <!-- Long raked fork -->
  <line x1="130" y1="32" x2="170" y2="82" stroke="#ccc" stroke-width="3"/>
  <!-- Second fork tube -->
  <line x1="128" y1="34" x2="168" y2="84" stroke="#ccc" stroke-width="2" opacity="0.5"/>
  <!-- Ape hanger handlebars -->
  <line x1="126" y1="30" x2="118" y2="14" stroke="#555" stroke-width="2.5"/>
  <line x1="130" y1="30" x2="138" y2="14" stroke="#555" stroke-width="2.5"/>
  <!-- Grips -->
  <rect x="115" y="10" width="6" height="5" rx="1" fill="#333"/>
  <rect x="135" y="10" width="6" height="5" rx="1" fill="#333"/>
  <!-- Headlight -->
  <circle cx="158" cy="58" r="5" fill="#ff0" stroke="#cc0" stroke-width="1"/>
  <!-- Front fender -->
  <path d="M162,68 Q170,60 178,68" fill="none" stroke="#e06000" stroke-width="2"/>
  <!-- Exhaust (long fishtail) -->
  <path d="M80,80 L48,90 L30,92" fill="none" stroke="#aaa" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Tail light -->
  <rect x="52" y="34" width="4" height="3" rx="1" fill="#f33"/>
  <!-- Footpeg (forward controls) -->
  <line x1="105" y1="78" x2="105" y2="84" stroke="#555" stroke-width="2"/>
  <rect x="102" y="84" width="6" height="2" rx="1" fill="#555"/>
</svg>
