  <!-- Body -->
  <line x1="100" y1="50" x2="100" y2="78" stroke="#444" stroke-width="3.5"/>
  <!-- Arms -->
  <line x1="100" y1="56" x2="78" y2="68" stroke="#444" stroke-width="2.5"/>
  <line x1="100" y1="56" x2="122" y2="68" stroke="#444" stroke-width="2.5"/>
  <!-- Legs -->
  <line x1="100" y1="78" x2="85" y2="102" stroke="#444" stroke-width="2.5"/>
  <line x1="100" y1="78" x2="115" y2="102" stroke="#444" stroke-width="2.5"/>
  <!-- Feet -->
  <line x1="85" y1="102" x2="80" y2="102" stroke="#444" stroke-width="2.5"/>
  <line x1="115" y1="102" x2="120" y2="102" stroke="#444" stroke-width="2.5"/>
